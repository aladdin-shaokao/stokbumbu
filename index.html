<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aladdin Shaokao Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0b0f17;
      font-family: Arial, sans-serif;
      color: #f3f4f6;
    }
    .logo-container {
      text-align: center;
      margin-top: 25px;
      margin-bottom: -15px;
    }
    .logo-img {
      max-height: 180px; 
      width: auto;
      object-fit: contain;
    }
    .card-custom {
      max-width: 440px;
      margin: 30px auto;
      border-radius: 16px;
      background-color: #1f2937;
      border: 1px solid #374151;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .card-header-brand {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid #374151;
    }
    .brand-logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .text-aladdin-gold {
      color: #dfb15b !important;
    }
    .form-label-custom {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .form-control-dark {
      background-color: #111827;
      border: 1px solid #4b5563;
      color: #dfb15b !important;
      font-weight: 600;
    }
    .form-control-dark:focus {
      background-color: #111827;
      border-color: #dfb15b;
      color: #dfb15b;
      box-shadow: 0 0 0 0.25rem rgba(223, 177, 91, 0.2);
    }
    .form-control-dark::placeholder {
      color: rgba(223, 177, 91, 0.6) !important;
      font-weight: 400;
    }
    .btn-danger-custom {
      background-color: #dc2626;
      color: white;
      border: none;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-danger-custom:hover {
      background-color: #b91c1c;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container px-3">
    
    <div class="logo-container">
      <img src="logo.png" alt="Aladdin Logo" class="logo-img">
    </div>

    <div class="card card-custom">
      <div class="card-header-brand">
        <div class="brand-logo">STOK BUMBU</div>
        <div class="small text-white-50 text-uppercase tracking-wider" style="font-size: 11px;">Aladdin Shaokao Inventory System</div>
      </div>
      
      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label form-label-custom text-aladdin-gold">USERNAME PETUGAS</label>
          <input type="text" id="username" class="form-control form-control-dark py-2.5" placeholder="Masukkan nama pengguna">
        </div>
        
        <div class="mb-4">
          <label class="form-label form-label-custom text-aladdin-gold">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-dark py-2.5" placeholder="Masukkan kata sandi">
        </div>
        
        <button onclick="prosesLoginKonektor()" class="btn btn-danger-custom w-100 py-2.5 text-uppercase">Masuk Sistem</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    function prosesLoginKonektor() {
      const userVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;

      if(!userVal || !passVal) {
        Swal.fire('Perhatian', 'Username dan password tidak boleh kosong.', 'warning');
        return;
      }

      Swal.fire({
        title: 'Memeriksa Data...',
        text: 'Menghubungkan ke server basis data',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      // Berkomunikasi langsung via engine bawaan Google Script Apps
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            Swal.close();
            // Jika backend Anda mengembalikan teks string atau objek, kita sesuaikan penanganannya
            let res = typeof response === 'string' ? JSON.parse(response) : response;
            
            if(res.status === "success" || res.success === true) {
              Swal.fire({
                icon: 'success',
                title: 'Login Sukses',
                text: 'Selamat datang kembali',
                timer: 1500,
                showConfirmButton: false
              }).then(() => {
                // Diarahkan langsung ke halaman form utama setelah sukses
                if(res.redirectUrl) {
                  window.location.href = res.redirectUrl;
                }
              });
            } else {
              Swal.fire('Gagal Masuk', res.message || 'Username atau Password salah.', 'error');
            }
          })
          .withFailureHandler(function(err) {
            Swal.close();
            Swal.fire('Eror Server', err.message, 'error');
          })
          .verifikasiLoginBackend(userVal, passVal); // <-- Pastikan nama fungsi di Kode.gs Anda sama dengan ini
      } else {
        // Fallback Pengaman jika dibuka langsung di luar ekosistem Web App Google
        setTimeout(() => {
          Swal.close();
          Swal.fire({
            icon: 'error',
            title: 'Akses Terbatas',
            text: 'Halaman ini harus dijalankan langsung dari link Web App Google Exec Anda agar terhubung ke database.',
          });
        }, 1000);
      }
    }
  </script>
</body>
</html>
