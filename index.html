<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aladdin Shaokao Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0b0f17;
      font-family: Arial, sans-serif;
      color: #f3f4f6;
    }
    .logo-container {
      text-align: center;
      margin-top: 25px;
      margin-bottom: -15px;
    }
    .logo-img {
      max-height: 180px; 
      width: auto;
      object-fit: contain;
    }
    .card-custom {
      max-width: 440px;
      margin: 30px auto;
      border-radius: 16px;
      background-color: #1f2937;
      border: 1px solid #374151;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .card-header-brand {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid #374151;
    }
    .brand-logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .text-aladdin-gold {
      color: #dfb15b !important;
    }
    .form-label-custom {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .form-control-dark {
      background-color: #111827;
      border: 1px solid #4b5563;
      color: #dfb15b !important;
      font-weight: 600;
    }
    .form-control-dark:focus {
      background-color: #111827;
      border-color: #dfb15b;
      color: #dfb15b;
      box-shadow: 0 0 0 0.25rem rgba(223, 177, 91, 0.2);
    }
    .form-control-dark::placeholder {
      color: rgba(223, 177, 91, 0.6) !important;
      font-weight: 400;
    }
    .btn-danger-custom {
      background-color: #dc2626;
      color: white;
      border: none;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-danger-custom:hover {
      background-color: #b91c1c;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container px-3">
    
    <div class="logo-container">
      <img src="logo.png" alt="Aladdin Logo" class="logo-img">
    </div>

    <div class="card card-custom">
      <div class="card-header-brand">
        <div class="brand-logo">STOK BUMBU</div>
        <div class="small text-white-50 text-uppercase tracking-wider" style="font-size: 11px;">Aladdin Shaokao Inventory System</div>
      </div>
      
      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label form-label-custom text-aladdin-gold">USERNAME PETUGAS</label>
          <input type="text" id="username" class="form-control form-control-dark py-2.5" placeholder="Masukkan nama pengguna">
        </div>
        
        <div class="mb-4">
          <label class="form-label form-label-custom text-aladdin-gold">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-dark py-2.5" placeholder="Masukkan kata sandi">
        </div>
        
        <button onclick="prosesLoginKonektor()" class="btn btn-danger-custom w-100 py-2.5 text-uppercase">Masuk Sistem</button>
      </div>
    </div>

  </div>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // ⚠️ PASTE URL WEB APP BARU ANDA DI SINI (Pastikan berakhiran /exec)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxONH3k6KSfAbeRQWc_hTNewsneDb2LAS47ZrGC56S4pB_1wrEKzpEBx-oLkp18_jBwbQ/exec";

    // FUNGSI JEMBATAN UNTUK MENGIRIM DATA LINTAS SERVER SECARA AMAN
    function kirimPermintaanJSONP(urlAwal, parameterData, fungsiSukses, fungsiGagal) {
      const namaFungsiCallback = 'aladdin_cb_' + Math.round(Math.random() * 1000000);
      
      // Menempelkan fungsi penangkap data sementara ke window browser
      window[namaFungsiCallback] = function(responServer) {
        delete window[namaFungsiCallback];
        document.body.removeChild(tagScript);
        fungsiSukses(responServer);
      };

      // Menyusun parameter URL string
      let urlLengkap = urlAwal + "?callback=" + namaFungsiCallback;
      for (let kunci in parameterData) {
        urlLengkap += "&" + kunci + "=" + encodeURIComponent(parameterData[kunci]);
      }

      // Membuat tag elemen script bayangan untuk memicu pertukaran data tanpa halangan CORS
      const tagScript = document.createElement('script');
      tagScript.src = urlLengkap;
      tagScript.onerror = function() {
        delete window[namaFungsiCallback];
        document.body.removeChild(tagScript);
        if (fungsiGagal) fungsiGagal();
      };
      document.body.appendChild(tagScript);
    }

    function prosesLoginKonektor() {
      const userVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;

      if(!userVal || !passVal) {
        Swal.fire('Perhatian', 'Username dan password wajib diisi.', 'warning');
        return;
      }

      Swal.fire({ title: 'Memeriksa Data...', text: 'Menghubungkan ke server basis data Aladdin', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      kirimPermintaanJSONP(
        WEB_APP_URL,
        { action: "login", username: userVal, password: passVal },
        function(res) {
          Swal.close();
          if(res.status === "success") {
            document.getElementById('namaPetugasAktif').innerText = res.data.Nama_Lengkap;
            document.getElementById('halamanLogin').style.display = 'none';
            document.getElementById('halamanDashboard').style.display = 'block';
            mulaiVerifikasiGPS();
          } else {
            Swal.fire('Gagal Masuk', res.message, 'error');
          }
        },
        function() {
          Swal.close();
          Swal.fire('Eror Server', 'Gagal merespon basis data. Pastikan status deployment Web App Anda diatur ke "Anyone".', 'error');
        }
      );
    }

    function mulaiVerifikasiGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) { suksesVerifikasiGPS("GPS Terverifikasi Aktif"); }, 
          function(error) { gagalVerifikasiGPS(); },
          { enableHighAccuracy: true, timeout: 6000 }
        );
      } else {
        gagalVerifikasiGPS();
      }
    }

    function suksesVerifikasiGPS(pesan) {
      const box = document.getElementById('gpsStatusBox');
      box.className = "p-3 rounded text-center fw-bold small bg-success text-white";
      box.innerHTML = `<i class="fas fa-check-circle me-2"></i> ${pesan}`;
      document.getElementById('menuSistem').style.display = 'block';
    }

    function gagalVerifikasiGPS() {
      const box = document.getElementById('gpsStatusBox');
      box.className = "p-3 rounded fw-bold small bg-warning text-dark d-flex justify-content-between align-items-center";
      box.innerHTML = `
        <span><i class="fas fa-exclamation-triangle me-2"></i> GPS Lemah / Tidak Terdeteksi</span>
        <button type="button" onclick="suksesVerifikasiGPS('GPS Dilewati (Mode Darurat)')" class="btn btn-sm btn-dark fw-bold px-2 py-1">Bypass</button>
      `;
      document.getElementById('menuSistem').style.display = 'block';
    }

    function bukaFormTrans(tipe) {
      const areaForm = document.getElementById('areaFormTransaksi');
      const judul = document.getElementById('judulForm');
      const labelJumlah = document.getElementById('labelJumlah');
      
      document.getElementById('jenisTransaksi').value = tipe;
      areaForm.classList.remove('d-none');
      
      if(tipe === 'MASUK') {
        judul.innerText = "Form Barang Masuk (Restock)";
        judul.className = "fw-bold text-success text-center mb-4";
        labelJumlah.innerText = "JUMLAH STOK MASUK";
      } else {
        judul.innerText = "Form Barang Keluar (Pemakaian)";
        judul.className = "fw-bold text-danger text-center mb-4";
        labelJumlah.innerText = "JUMLAH STOK KELUAR";
      }
      areaForm.scrollIntoView({ behavior: 'smooth' });
    }

    function prosesDekodeBarcodeFile(input) {
      if (!input.files || input.files.length === 0) return;

      Swal.fire({ title: 'Membaca Barcode...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      const fileGambar = input.files[0];
      const html5QrCode = new Html5Qrcode("barcodeBumbu");

      html5QrCode.scanFile(fileGambar, true)
        .then(teksBarcode => {
          Swal.close();
          document.getElementById('barcodeBumbu').value = teksBarcode;
          Swal.fire({ title: 'Terbaca!', icon: 'success', timer: 1000, showConfirmButton: false });
        })
        .catch(err => {
          Swal.close();
          Swal.fire('Gagal Membaca', 'Stiker barcode bumbu kurang jelas atau tidak terdeteksi. Silakan coba lagi.', 'warning');
          document.getElementById('barcodeBumbu').value = "";
        });
    }

    function fotoBerhasilDiambil(input) {
      if (input.files && input.files[0]) {
        document.getElementById('textStatusFoto').innerText = "✓ FOTO BERHASIL DIKONFIRMASI";
        document.getElementById('textStatusFoto').className = "small fw-bold text-success";
      }
    }

    function kirimDataTransaksi(e) {
      e.preventDefault();
      Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      const payload = {
        jenis: document.getElementById('jenisTransaksi').value,
        barcode: document.getElementById('barcodeBumbu').value,
        jumlah: document.getElementById('jumlahBumbu').value
      };

      kirimPermintaanJSONP(
        WEB_APP_URL,
        { action: "transaksi", payload: JSON.stringify(payload) },
        function(res) {
          Swal.close();
          if (res.status === "success") {
            Swal.fire('Berhasil!', 'Transaksi bumbu berhasil dicatat ke Google Sheets.', 'success').then(() => {
              document.getElementById('formTransaksi').reset();
              document.getElementById('areaFormTransaksi').classList.add('d-none');
              document.getElementById('textStatusFoto').innerText = "TAP TO CAPTURE PHOTO";
              document.getElementById('textStatusFoto').className = "small fw-bold text-uppercase text-danger";
            });
          } else {
            Swal.fire('Gagal', res.message, 'error');
          }
        },
        function() {
          Swal.close();
          Swal.fire('Eror Transaksi', 'Koneksi terputus saat menyimpan data.', 'error');
        }
      );
    }
  </script>
