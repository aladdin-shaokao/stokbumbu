<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi Stok Bumbu - Aladdin Shaokao</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #111827; /* Mengganti latar belakang utama menjadi gelap/hitam elegan */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 1. PERBAIKAN LOGO: MEMPERBESAR DAN MERAPIKAN NAVBAR */
        .navbar-logo {
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            padding: 15px 20px; /* Menambah padding agar navbar sedikit lebih longgar */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            height: 90px; /* Menaikkan tinggi navbar dari 65px menjadi 90px */
            box-sizing: border-box;
            border-bottom: 3px solid #dc2626; /* Memberikan garis aksen merah di bawah logo */
        }
        .navbar-logo img {
            height: 65px; /* Memperbesar tinggi logo dari 45px menjadi 65px agar terlihat sangat jelas */
            width: auto;
            max-width: 280px;
            object-fit: contain;
        }
        
        /* CONTAINER UTAMA APLIKASI */
        .app-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 90px);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="navbar-logo">
        <img src="logo.png" alt="Aladdin Shaokao Logo" onerror="this.src='https://placehold.co/300x70?text=ALADDIN+SHAOKAO'">
    </div>

    <div class="app-container">
        <iframe src="https://script.google.com/macros/s/AKfycbxONH3k6KSfAbeRQWc_hTNewsneDb2LAS47ZrGC56S4pB_1wrEKzpEBx-oLkp18_jBwbQ/exec"></iframe>
    </div>

</body>
</html>
