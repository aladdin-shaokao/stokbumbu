<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aladdin Shaokao Inventory System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { background-color: #0b0f17; font-family: Arial, sans-serif; color: #f3f4f6; margin: 0; padding: 0; }
    .logo-container { text-align: center; margin-top: 10px; margin-bottom: -10px; }
    .logo-img { max-height: 200px; width: 80%; max-width: 250px; object-fit: contain; display: block; margin: 0 auto; }
    .card-custom { max-width: 100%; width: 420px; margin: 20px auto; border-radius: 16px; background-color: #1f2937; border: 1px solid #374151; box-shadow: 0 12px 30px rgba(0,0,0,0.5); overflow: hidden; }
    .card-header-brand { background: linear-gradient(135deg, #dc2626, #991b1b); padding: 24px; text-align: center; border-bottom: 1px solid #374151; }
    .brand-logo { font-size: 24px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff; }
    .text-aladdin-gold { color: #dfb15b !important; }
    .form-label-custom { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
    .form-control-dark { background-color: #111827; border: 1px solid #4b5563; color: #dfb15b !important; font-weight: 600; font-size: 16px; }
    .btn-danger-custom { background-color: #dc2626; color: white; border: none; font-weight: 700; font-size: 16px; transition: 0.2s; }
    .btn-danger-custom:hover { background-color: #b91c1c; }
    
    .header-dashboard { background: linear-gradient(135deg, #dc2626, #991b1b); padding: 20px; border-bottom: 3px solid #dfb15b; }
    .btn-menu { padding: 18px; font-weight: 800; font-size: 16px; border-radius: 12px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; }
    .btn-stok-masuk { background-color: #10b981; color: white; }
    .btn-stok-keluar { background-color: #ef4444; color: white; }
    .photo-box { border: 2px dashed #dc2626; border-radius: 10px; padding: 25px; text-align: center; background-color: #111827; }
    
    /* Style Khusus Live Scanner */
    #kotakLiveScanner { width: 100%; max-width: 380px; margin: 12px auto; display: none; border: 3px solid #dfb15b; border-radius: 12px; overflow: hidden; background-color: #000; }
    .product-preview-box { background-color: #111827; border: 2px solid #dfb15b; border-radius: 12px; padding: 15px; margin-top: 12px; text-align: center; display: none; }
    .product-preview-img { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid #374151; object-fit: contain; }
  </style>
</head>
<body>

  <div id="halamanLogin" class="container px-3">
   <div class="logo-container">
  <img src="logo.png" alt="Aladdin Logo" class="logo-img">
</div>
    <div class="card card-custom">
      <div class="card-header-brand">
        <div class="brand-logo">STOK BUMBU</div>
        <div class="small text-white-50 text-uppercase" style="font-size: 11px; letter-spacing: 1px; margin-top: 4px;">Inventory Control Centre</div>
      </div>
      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label form-label-custom text-aladdin-gold">USERNAME PETUGAS</label>
          <input type="text" id="username" class="form-control form-control-dark py-2.5" placeholder="Masukkan nama pengguna">
        </div>
        <div class="mb-4">
          <label class="form-label form-label-custom text-aladdin-gold">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-dark py-2.5" placeholder="Masukkan kata sandi">
        </div>
        <button onclick="eksekusiKoneksiJSONP()" class="btn btn-danger-custom w-100 py-2.5 text-uppercase">Masuk Sistem</button>
      </div>
    </div>
  </div>

  <div id="halamanDashboard" style="display: none;">
    <div class="header-dashboard text-center">
      <h4 class="fw-bold text-white mb-1">Halo, <span id="namaPetugasAktif">Petugas</span></h4>
      <p class="small text-white-50 mb-0">Aladdin Shaokao Inventory System</p>
    </div>

    <div class="container px-3 pb-5">
      <div class="mt-4">
        <div id="gpsStatusBox" class="bg-secondary text-white p-3 rounded text-center fw-bold small">
          <i class="fas fa-spinner fa-spin me-2"></i> Memverifikasi Jarak Cabang Aktual...
        </div>
      </div>

      <div class="mt-4" id="menuSistem" style="display: none;">
        <div class="row g-3">
          <div class="col-6">
            <button id="btnStokMasukMenu" onclick="bukaFormTrans('MASUK')" class="btn btn-menu btn-stok-masuk w-100">
              <i class="fas fa-box-open d-block mb-2 fa-lg"></i> STOK MASUK
            </button>
          </div>
          <div class="col-6">
            <button id="btnStokKeluarMenu" onclick="bukaFormTrans('KELUAR')" class="btn btn-menu btn-stok-keluar w-100">
              <i class="fas fa-shipping-fast d-block mb-2 fa-lg"></i> STOK KELUAR
            </button>
          </div>
        </div>
      </div>

      <div id="areaFormTransaksi" class="card p-4 mt-4 d-none" style="background-color: #1f2937; border: 1px solid #374151; border-radius: 12px;">
        <h5 id="judulForm" class="fw-bold text-uppercase text-center mb-4">FORM TRANSAKSI</h5>
        <form id="formTransaksi" onsubmit="kirimDataTransaksi(event)">
          <input type="hidden" id="jenisTransaksi">

          <div class="mb-3">
            <label class="form-label small fw-bold text-aladdin-gold">SCAN BARCODE / QR BUMBU (LIVE CAMERA)</label>
            <div class="input-group">
              <input type="text" id="barcodeBumbu" class="form-control form-control-dark" placeholder="Ketuk Mulai Live Scan..." required readonly>
              <button class="btn btn-danger fw-bold" type="button" id="btnTriggerScanner" onclick="toggleLiveScanner()">
                <i class="fas fa-qrcode me-1"></i> Mulai Scan
              </button>
            </div>
            
            <div id="kotakLiveScanner"></div>
            
            <div id="previewBarangBox" class="product-preview-box">
              <div class="small text-white-50 mb-2">PREVIEW PRODUK BUMBU</div>
              <img id="imgPreviewBarang" src="" class="product-preview-img" alt="Preview">
            </div>
          </div>

          <div class="mb-3">
            <label id="labelJumlah" class="form-label small fw-bold text-aladdin-gold">JUMLAH STOK</label>
            <input type="number" id="jumlahBumbu" class="form-control form-control-dark py-2" placeholder="Masukkan angka jumlah" required>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-aladdin-gold">AMBIL GAMBAR FISIK BUMBU</label>
            <div class="photo-box" onclick="document.getElementById('fileFotoFisik').click()" style="cursor: pointer;">
              <i class="fas fa-camera-retro fa-2x text-danger mb-2"></i>
              <div class="small fw-bold text-uppercase text-danger" id="textStatusFoto">TAP TO CAPTURE PHOTO</div>
              <input type="file" id="fileFotoFisik" accept="image/*" capture="environment" style="display: none;" onchange="fotoBerhasilDiambil(this)">
            </div>
          </div>

          <button type="submit" id="btnSubmitLaporan" class="btn btn-warning w-100 py-2.5 fw-bold text-uppercase" style="font-size: 16px;">Kirim Laporan Stok</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw2JjLlqZo1GET5llD5i4APwCgRCkIi9bH8E6LNGz_AF0pJWtbxehB_MenfOA-rPJgHoQ/exec"; 

    let NAMA_PETUGAS_LOGGED_IN = "";
    let CABANG_TERVERIFIKASI = "Belum Diketahui";
    let KOORDINAT_TEREKAM = "0,0";
    let DATA_BASE64_FOTO = "";
    let DATABASE_BARANG_LOCAL = {};
    let objLiveScannerInstance = null;

    // --- LOGIN ENGINE ---
    function eksekusiKoneksiJSONP() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if(!user || !pass) {
        Swal.fire('Perhatian', 'Username dan password wajib diisi.', 'warning');
        return;
      }

      Swal.fire({ title: 'Memeriksa Akses...', text: 'Menghubungkan ke server pusat...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      const scriptBypass = document.createElement('script');
      scriptBypass.src = `${WEB_APP_URL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&callback=responLoginPusat`;
      document.body.appendChild(scriptBypass);
    }

    function responLoginPusat(res) {
      Swal.close();
      if(res.status === "success") {
        NAMA_PETUGAS_LOGGED_IN = res.data.Nama_Lengkap;
        DATABASE_BARANG_LOCAL = res.databaseBarang || {};

        document.getElementById('namaPetugasAktif').innerText = NAMA_PETUGAS_LOGGED_IN;
        document.getElementById('halamanLogin').style.display = 'none';
        document.getElementById('halamanDashboard').style.display = 'block';
        
        // Jalankan Validasi Koordinat GPS Asli Lintas Cabang (PIK 1 vs Serpong)
        prosesHitungGPSFisik(res.cabangList);
      } else {
        Swal.fire('Gagal Masuk', res.message, 'error');
      }
    }

    // --- ENGINE DETEKSI GPS AKTUAL (ANTI SALAH BACA CABANG) ---
    function prosesHitungGPSFisik(cabangList) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            const latUser = pos.coords.latitude;
            const lngUser = pos.coords.longitude;
            KOORDINAT_TEREKAM = latUser + "," + lngUser;

            if(!cabangList || cabangList.length === 0) {
              CABANG_TERVERIFIKASI = "PIK 1"; // Fallback aman
              kunciStatusSuksesGPS("Cabang: PIK 1 (Default)");
              return;
            }

            let cabangTerdekat = "";
            let jarakTerkecil = Infinity;

            // Rumus Haversine menentukan cabang terdekat dari posisi HP real-time
            cabangList.forEach(cb => {
              const R = 6371e3; // radius bumi dalam meter
              const phi1 = latUser * Math.PI/180;
              const phi2 = cb.lat * Math.PI/180;
              const deltaPhi = (cb.lat - latUser) * Math.PI/180;
              const deltaLambda = (cb.lng - lngUser) * Math.PI/180;

              const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                        Math.cos(phi1) * Math.cos(phi2) *
                        Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              const jarakMeter = R * c;

              if(jarakMeter < jarakTerkecil) {
                jarakTerkecil = jarakMeter;
                cabangTerdekat = cb.nama;
              }
            });

            CABANG_TERVERIFIKASI = cabangTerdekat;
            kunciStatusSuksesGPS("Terdeteksi di Cabang: " + CABANG_TERVERIFIKASI);
          },
          function() {
            kunciStatusGagalGPS();
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        kunciStatusGagalGPS();
      }
    }

    function kunciStatusSuksesGPS(pesan) {
      const box = document.getElementById('gpsStatusBox');
      box.className = "p-3 rounded text-center fw-bold small bg-success text-white";
      box.innerHTML = `<i class="fas fa-check-circle me-2"></i> ${pesan}`;
      document.getElementById('menuSistem').style.display = 'block';
    }

    function kunciStatusGagalGPS() {
      const box = document.getElementById('gpsStatusBox');
      box.className = "p-3 rounded fw-bold small bg-warning text-dark d-flex justify-content-between align-items-center";
      box.innerHTML = `
        <span><i class="fas fa-exclamation-triangle me-2"></i> GPS Lemah (Gagal Kunci Lokasi)</span>
        <button type="button" onclick="bypassGPSPIK()" class="btn btn-sm btn-dark fw-bold px-2 py-1">Set PIK 1</button>
      `;
      document.getElementById('menuSistem').style.display = 'block';
    }

    function bypassGPSPIK() {
      KOORDINAT_TEREKAM = "-6.0940,106.7437"; 
      CABANG_TERVERIFIKASI = "PIK 1";
      kunciStatusSuksesGPS("Cabang Dikunci Manual: PIK 1");
    }

    // --- ENGINE LIVE CAMERA SCANNER (BUKAN JEPRET FOTO MANUAL) ---
    function toggleLiveScanner() {
      const areaVideo = document.getElementById('kotakLiveScanner');
      const btn = document.getElementById('btnTriggerScanner');

      // Jika scanner sedang jalan, matikan
      if (objLiveScannerInstance) {
        matikanKameraLive();
        return;
      }

      // Jika scanner belum jalan, hidupkan stream video kamera belakang
      areaVideo.style.display = 'block';
      btn.innerHTML = `<i class="fas fa-stop me-1"></i> Matikan Kamera`;
      btn.className = "btn btn-dark fw-bold";

      objLiveScannerInstance = new Html5Qrcode("kotakLiveScanner");
      objLiveScannerInstance.start(
        { facingMode: "environment" }, 
        { fps: 15, qrbox: { width: 250, height: 250 } },
        function onScanSuccess(decodedText) {
          document.getElementById('barcodeBumbu').value = decodedText;
          
          // Cari preview gambar bumbu
          const boxPreview = document.getElementById('previewBarangBox');
          const imgPreview = document.getElementById('imgPreviewBarang');
          if (DATABASE_BARANG_LOCAL[decodedText] && DATABASE_BARANG_LOCAL[decodedText].foto) {
            imgPreview.src = DATABASE_BARANG_LOCAL[decodedText].foto;
            boxPreview.style.display = 'block';
          } else {
            boxPreview.style.display = 'none';
          }

          Swal.fire({ title: 'Terbaca!', icon: 'success', timer: 800, showConfirmButton: false });
          matikanKameraLive();
        },
        function onScanError(err) {
          // Abaikan log error scanning konstan saat kamera mendeteksi frame kosong
        }
      ).catch(err => {
        Swal.fire('Kamera Gagal', 'Pastikan izin akses kamera browser sudah diperbolehkan.', 'error');
        matikanKameraLive();
      });
    }

    function matikanKameraLive() {
      const areaVideo = document.getElementById('kotakLiveScanner');
      const btn = document.getElementById('btnTriggerScanner');
      
      if (objLiveScannerInstance) {
        objLiveScannerInstance.stop().then(() => {
          objLiveScannerInstance = null;
          areaVideo.style.display = 'none';
          btn.innerHTML = `<i class="fas fa-camera me-1"></i> Mulai Scan`;
          btn.className = "btn btn-danger fw-bold";
        }).catch(() => {
          objLiveScannerInstance = null;
          areaVideo.style.display = 'none';
          btn.innerHTML = `<i class="fas fa-camera me-1"></i> Mulai Scan`;
          btn.className = "btn btn-danger fw-bold";
        });
      }
    }

    function bukaFormTrans(tipe) {
      document.getElementById('jenisTransaksi').value = tipe;
      const area = document.getElementById('areaFormTransaksi');
      const judul = document.getElementById('judulForm');
      const lbl = document.getElementById('labelJumlah');
      
      area.classList.remove('d-none');
      if(tipe === 'MASUK') {
        judul.innerText = "Form Barang Masuk (Restock)";
        judul.className = "fw-bold text-success text-center mb-4";
        lbl.innerText = "JUMLAH STOK MASUK";
      } else {
        judul.innerText = "Form Barang Keluar (Pemakaian)";
        judul.className = "fw-bold text-danger text-center mb-4";
        lbl.innerText = "JUMLAH STOK KELUAR";
      }
      area.scrollIntoView({ behavior: 'smooth' });
    }

    function fotoBerhasilDiambil(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        document.getElementById('textStatusFoto').innerText = "⚡ SEDANG MEMPROSES FOTO...";
        reader.onload = function(e) {
          DATA_BASE64_FOTO = e.target.result;
          const statusTxt = document.getElementById('textStatusFoto');
          statusTxt.innerText = "✓ FOTO BERHASIL DIKONFIRMASI";
          statusTxt.className = "small fw-bold text-success";
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // --- ENGINE PENGIRIMAN DATA ---
    function kirimDataTransaksi(e) {
      if (e && e.preventDefault) { e.preventDefault(); }

      const btnSubmit = document.getElementById('btnSubmitLaporan');
      if (btnSubmit) { btnSubmit.disabled = true; }

      Swal.fire({ 
        title: 'Menyimpan...', 
        text: 'Mengirim laporan stok bumbu ke database cloud...',
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
      });

      const payload = {
        petugas: NAMA_PETUGAS_LOGGED_IN || "Petugas Aladdin",
        cabang: CABANG_TERVERIFIKASI || "Gudang Pusat",
        jenisStok: document.getElementById('jenisTransaksi').value,
        barcode: document.getElementById('barcodeBumbu').value,
        jumlah: parseInt(document.getElementById('jumlahBumbu').value) || 0,
        fotoBase64: DATA_BASE64_FOTO || "",
        koordinat: KOORDINAT_TEREKAM || "0,0"
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain; charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(function() {
        suksesTransaksiAplikasi();
      })
      .catch(function() {
        // Metode Injeksi Tag Cadangan jika terblokir jaringan lokal
        const scriptBackup = document.createElement('script');
        const dataEnc = encodeURIComponent(JSON.stringify(payload));
        scriptBackup.src = `${WEB_APP_URL}?action=kirimManual&data=${dataEnc}&callback=responKirimManual`;
        document.body.appendChild(scriptBackup);
      });
    }

    function suksesTransaksiAplikasi() {
      const btnSubmit = document.getElementById('btnSubmitLaporan');
      if (btnSubmit) { btnSubmit.disabled = false; }
      Swal.close();
      
      Swal.fire({
        title: 'Berhasil!',
        text: 'Transaksi bumbu berhasil dicatat di Google Sheets.',
        icon: 'success'
      }).then(() => {
        document.getElementById('formTransaksi').reset();
        document.getElementById('areaFormTransaksi').classList.add('d-none');
        document.getElementById('previewBarangBox').style.display = 'none';
        
        const txtFoto = document.getElementById('textStatusFoto');
        txtFoto.innerText = "TAP TO CAPTURE PHOTO";
        txtFoto.className = "small fw-bold text-uppercase text-danger";
        DATA_BASE64_FOTO = "";
        matikanKameraLive();
      });
    }
  </script>
</body>
</html>
