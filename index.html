<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi Stok Bumbu - Aladdin Shaokao</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .app-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 140px);
            position: relative;
        }
        
        .navbar-logo {
            background-color: #000000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            padding: 10px 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            height: 140px; 
            box-sizing: border-box;
            border-bottom: 4px solid #dc2626;
        }
        
        .navbar-logo img {
            height: 110px; 
            width: auto;
            max-width: 90%; 
            object-fit: contain;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="navbar-logo">
        <img src="logo.png" alt="Aladdin Shaokao Logo" onerror="this.src='https://placehold.co/350x110/000000/ffffff?text=ALADDIN+SHAOKAO'">
    </div>

    <div class="app-container">
        <iframe src="https://script.google.com/macros/s/AKfycbxONH3k6KSfAbeRQWc_hTNewsneDb2LAS47ZrGC56S4pB_1wrEKzpEBx-oLkp18_jBwbQ/exec" allow="camera; geolocation"></iframe>
    </div>

</body>
</html>
