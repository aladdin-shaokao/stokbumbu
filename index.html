<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aladdin Shaokao Inventory System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { background-color: #0b0f17; font-family: Arial, sans-serif; color: #f3f4f6; margin: 0; padding: 0; }
    .logo-container { text-align: center; margin-top: 35px; margin-bottom: 15px; }
    .logo-img { max-height: 140px; width: auto; object-fit: contain; display: block; margin: 0 auto; }
    .card-custom { max-width: 100%; width: 420px; margin: 20px auto; border-radius: 16px; background-color: #1f2937; border: 1px solid #374151; box-shadow: 0 12px 30px rgba(0,0,0,0.5); overflow: hidden; }
    .card-header-brand { background: linear-gradient(135deg, #dc2626, #991b1b); padding: 24px; text-align: center; border-bottom: 1px solid #374151; }
    .brand-logo { font-size: 24px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff; }
    .text-aladdin-gold { color: #dfb15b !important; }
    .form-label-custom { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
    .form-control-dark { background-color: #111827; border: 1px solid #4b5563; color: #dfb15b !important; font-weight: 600; font-size: 16px; }
    .btn-danger-custom { background-color: #dc2626; color: white; border: none; font-weight: 700; font-size: 16px; transition: 0.2s; }
    .btn-danger-custom:hover { background-color: #b91c1c; }
    
    .header-dashboard { background: linear-gradient(135deg, #dc2626, #991b1b); padding: 20px; border-bottom: 3px solid #dfb15b; }
    .btn-menu { padding: 18px; font-weight: 800; font-size: 16px; border-radius: 12px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .btn-stok-masuk { background-color: #10b981; color: white; }
    .btn-stok-keluar { background-color: #ef4444; color: white; }
    .photo-box { border: 2px dashed #dc2626; border-radius: 10px; padding: 25px; text-align: center; background-color: #111827; }
  </style>
</head>
<body>

  <div id="halamanLogin" class="container px-3">
    <div class="logo-container">
      <img src="logo.png" onerror="this.src='https://raw.githubusercontent.com/aladdin-shaokao/assets/main/logo.png'" alt="Aladdin Logo" class="logo-img">
    </div>

    <div class="card card-custom">
      <div class="card-header-brand">
        <div class="brand-logo">STOK BUMBU</div>
        <div class="small text-white-50 text-uppercase" style="font-size: 11px; letter-spacing: 1px; margin-top: 4px;">Inventory Control Centre</div>
      </div>
      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label form-label-custom text-aladdin-gold">USERNAME PETUGAS</label>
          <input type="text" id="username" class="form-control form-control-dark py-2.5" placeholder="Masukkan nama pengguna">
        </div>
        <div class="mb-4">
          <label class="form-label form-label-custom text-aladdin-gold">PASSWORD</label>
          <input type="password" id="password" class="form-control form-control-dark py-2.5" placeholder="Masukkan kata sandi">
        </div>
        <button onclick="eksekusiKoneksiJSONP()" class="btn btn-danger-custom w-100 py-2.5 text-uppercase">Masuk Sistem</button>
      </div>
    </div>
  </div>

  <div id="halamanDashboard" style="display: none;">
    <div class="header-dashboard text-center">
      <h4 class="fw-bold text-white mb-1">Halo, <span id="namaPetugasAktif">Petugas</span></h4>
      <p class="small text-white-50 mb-0">Aladdin Shaokao Inventory System</p>
    </div>

    <div class="container px-3 pb-5">
      <div class="mt-4">
        <div id="gpsStatusBox" class="bg-secondary text-white p-3 rounded text-center fw-bold small">
          <i class="fas fa-spinner fa-spin me-2"></i> Memverifikasi Lokasi Cabang...
        </div>
      </div>

      <div class="mt-4">
        <div class="row g-3">
          <div class="col-6">
            <button onclick="bukaFormTrans('MASUK')" class="btn btn-menu btn-stok-masuk w-100">
              <i class="fas fa-box-open d-block mb-2 fa-lg"></i> STOK MASUK
            </button>
          </div>
          <div class="col-6">
            <button onclick="bukaFormTrans('KELUAR')" class="btn btn-menu btn-stok-keluar w-100">
              <i class="fas fa-shipping-fast d-block mb-2 fa-lg"></i> STOK KELUAR
            </button>
          </div>
        </div>
      </div>

      <div id="areaFormTransaksi" class="card p-4 mt-4 d-none" style="background-color: #1f2937; border: 1px solid #374151; border-radius: 12px;">
        <h5 id="judulForm" class="fw-bold text-uppercase text-center mb-4">FORM TRANSAKSI</h5>
        <form id="formTransaksi" onsubmit="kirimDataTransaksi(event)">
          <input type="hidden" id="jenisTransaksi">

          <div class="mb-3">
            <label class="form-label small fw-bold text-aladdin-gold">SCAN BARCODE / QR BUMBU</label>
            <div class="input-group">
              <input type="text" id="barcodeBumbu" class="form-control form-control-dark" placeholder="Ketuk tombol Kamera Scan..." required readonly>
              <button class="btn btn-danger fw-bold" type="button" onclick="document.getElementById('fileInputBarcode').click()">
                <i class="fas fa-camera me-1"></i> Kamera Scan
              </button>
            </div>
            <input type="file" id="fileInputBarcode" accept="image/*" capture="environment" style="display: none;" onchange="prosesDekodeBarcodeFile(this)">
          </div>

          <div class="mb-3">
            <label id="labelJumlah" class="form-label small fw-bold text-aladdin-gold">JUMLAH STOK</label>
            <input type="number" id="jumlahBumbu" class="form-control form-control-dark py-2" placeholder="Masukkan angka jumlah" required>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-aladdin-gold">AMBIL GAMBAR FISIK BUMBU</label>
            <div class="photo-box" onclick="document.getElementById('fileFotoFisik').click()" style="cursor: pointer;">
              <i class="fas fa-camera-retro fa-2x text-danger mb-2"></i>
              <div class="small fw-bold text-uppercase text-danger" id="textStatusFoto">TAP TO CAPTURE PHOTO</div>
              <input type="file" id="fileFotoFisik" accept="image/*" capture="environment" style="display: none;" onchange="fotoBerhasilDiambil(this)">
            </div>
          </div>

          <button type="submit" class="btn btn-warning w-100 py-2.5 fw-bold text-uppercase" style="font-size: 16px; color: #111;">Kirim Laporan Stok</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxONH3k6KSfAbeRQWc_hTNewsneDb2LAS47ZrGC56S4pB_1wrEKzpEBx-oLkp18_jBwbQ/exec";

    let DAFTAR_OUTLET_DARI_SHEET = [];
    
    // Variabel Global untuk Menampung Hasil Validasi GPS & Foto Base64
    let NAMA_PETUGAS_LOGGED_IN = "";
    let CABANG_TERVERIFIKASI = "Belum Diketahui";
    let KOORDINAT_TEREKAM = "0,0";
    let JARAK_TERHITUNG = "0";
    let DATA_BASE64_FOTO = "";

    function eksekusiKoneksiJSONP() {
      const userVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;

      if(!userVal || !passVal) {
        Swal.fire('Perhatian', 'Username dan password wajib diisi.', 'warning');
        return;
      }

      Swal.fire({ 
        title: 'Memeriksa Data...', 
        text: 'Menghubungkan ke basis data Aladdin Shaokao...', 
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
      });

      const namaCallback = 'aladdin_login_cb_' + Math.round(Math.random() * 100000);
      
      window[namaCallback] = function(respon) {
        Swal.close();
        delete window[namaCallback];
        document.body.removeChild(tagScript);

        if(respon.status === "success") {
          NAMA_PETUGAS_LOGGED_IN = respon.data.Nama_Lengkap;
          document.getElementById('namaPetugasAktif').innerText = NAMA_PETUGAS_LOGGED_IN;
          document.getElementById('halamanLogin').style.display = 'none';
          document.getElementById('halamanDashboard').style.display = 'block';

          DAFTAR_OUTLET_DARI_SHEET = respon.cabangList || [];
          prosesValidasiLokasiKerja();
        } else {
          Swal.fire('Gagal Masuk', respon.message, 'error');
        }
      };

      const urlTujuan = WEB_APP_URL + "?callback=" + namaCallback + "&action=login&username=" + encodeURIComponent(userVal) + "&password=" + encodeURIComponent(passVal);
      const tagScript = document.createElement('script');
      tagScript.src = urlTujuan;
      tagScript.onerror = function() {
        Swal.close();
        delete window[namaCallback];
        document.body.removeChild(tagScript);
        Swal.fire('Koneksi Eror', 'Gagal memanggil data spreadsheet.', 'error');
      };
      document.body.appendChild(tagScript);
    }

    function prosesValidasiLokasiKerja() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const latUser = position.coords.latitude;
            const lngUser = position.coords.longitude;
            KOORDINAT_TEREKAM = `${latUser}, ${lngUser}`;
            
            let cabangDitemukan = null;
            let minimalJarak = 9999999;

            for (let outlet of DAFTAR_OUTLET_DARI_SHEET) {
              const jarak = hitungRumusHaversine(latUser, lngUser, outlet.lat, outlet.lng);
              if (jarak <= outlet.radiusMeter) {
                cabangDitemukan = outlet.nama;
                JARAK_TERHITUNG = Math.round(jarak).toString();
                break;
              }
              if (jarak < minimalJarak) {
                minimalJarak = jarak;
                JARAK_TERHITUNG = Math.round(jarak).toString();
              }
            }

            if (cabangDitemukan) {
              CABANG_TERVERIFIKASI = cabangDitemukan;
              tampilkanStatusGPS("sukses", `GPS TERVERIFIKASI AKTIF (${CABANG_TERVERIFIKASI})`);
            } else {
              CABANG_TERVERIFIKASI = "Luar Radius";
              tampilkanStatusGPS("luar_radius", "LOKASI DI LUAR RADIUS OUTLET RESMI");
            }
          },
          function(error) {
            tampilkanStatusGPS("eror", "GPS LEMAH / IZIN LOKASI DITOLAK");
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        tampilkanStatusGPS("eror", "BROWSER TIDAK MENDUKUNG GPS");
      }
    }

    function hitungRumusHaversine(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const deltaPhi = (lat2 - lat1) * Math.PI / 180;
      const deltaLambda = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c; 
    }

    function tampilkanStatusGPS(tipe, pesan) {
      const box = document.getElementById('gpsStatusBox');
      if (tipe === "sukses") {
        box.className = "bg-success text-white p-3 rounded text-center fw-bold small";
        box.innerHTML = `<i class="fas fa-check-circle me-2"></i> ${pesan}`;
      } else if (tipe === "luar_radius") {
        box.className = "bg-warning text-dark p-3 rounded fw-bold small d-flex justify-content-between align-items-center";
        box.innerHTML = `
          <span><i class="fas fa-exclamation-triangle me-2"></i> ${pesan}</span>
          <button type="button" onclick="bypassGpsMode()" class="btn btn-sm btn-dark fw-bold px-2 py-1">Bypass</button>
        `;
      } else {
        box.className = "bg-danger text-white p-3 rounded fw-bold small d-flex justify-content-between align-items-center";
        box.innerHTML = `
          <span><i class="fas fa-times-circle me-2"></i> ${pesan}</span>
          <button type="button" onclick="bypassGpsMode()" class="btn btn-sm btn-light fw-bold px-2 py-1">Bypass</button>
        `;
      }
    }

    function bypassGpsMode() {
      CABANG_TERVERIFIKASI = "Bypass Darurat";
      tampilkanStatusGPS("sukses", `GPS DILEWATI (MODE DARURAT)`);
    }

    function bukaFormTrans(tipe) {
      const areaForm = document.getElementById('areaFormTransaksi');
      const judul = document.getElementById('judulForm');
      const labelJumlah = document.getElementById('labelJumlah');
      
      document.getElementById('jenisTransaksi').value = tipe;
      areaForm.classList.remove('d-none');
      
      if(tipe === 'MASUK') {
        judul.innerText = "Form Barang Masuk (Restock)";
        judul.className = "fw-bold text-success text-center mb-4";
        labelJumlah.innerText = "JUMLAH STOK MASUK";
      } else {
        judul.innerText = "Form Barang Keluar (Pemakaian)";
        judul.className = "fw-bold text-danger text-center mb-4";
        labelJumlah.innerText = "JUMLAH STOK KELUAR";
      }
      areaForm.scrollIntoView({ behavior: 'smooth' });
    }

    function prosesDekodeBarcodeFile(input) {
      if (!input.files || input.files.length === 0) return;
      
      Swal.fire({ 
        title: 'Memproses Gambar...', 
        text: 'Mengoptimalkan resolusi foto kamera...',
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
      });

      const fileGambar = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob(function(blob) {
            const fileSiapScan = new File([blob], fileGambar.name, { type: "image/jpeg" });
            const html5QrCode = new Html5Qrcode("barcodeBumbu");

            html5QrCode.scanFile(fileSiapScan, true)
              .then(teksBarcode => {
                Swal.close();
                document.getElementById('barcodeBumbu').value = teksBarcode;
                
                Swal.fire({ 
                  title: 'Scan Berhasil!', 
                  text: 'Kode Terbaca: ' + teksBarcode, 
                  icon: 'success', 
                  timer: 2000, 
                  showConfirmButton: false 
                });
              })
              .catch(err => {
                Swal.close();
                console.error("Detail Error Scan:", err);
                Swal.fire(
                  'Gagal Membaca', 
                  'Pastikan posisi QR Code tegak lurus, fokus, dan tidak terlalu jauh dari kamera. Silakan coba foto ulang.', 
                  'warning'
                );
                document.getElementById('barcodeBumbu').value = "";
              });
          }, 'image/jpeg', 0.8);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(fileGambar);
    }

    function fotoBerhasilDiambil(input) {
      if (input.files && input.files[0]) {
        document.getElementById('textStatusFoto').innerText = "⏳ MEMPROSES FOTO...";
        document.getElementById('textStatusFoto').className = "small fw-bold text-warning";
        
        const file = input.files[0];
        const reader = new FileReader();
        
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 600;
            let w = img.width;
            let h = img.height;
            
            if (w > h) {
              if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; }
            } else {
              if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
            }
            
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            DATA_BASE64_FOTO = canvas.toDataURL('image/jpeg', 0.7);
            
            document.getElementById('textStatusFoto').innerText = "✓ FOTO BERHASIL DIKONFIRMASI";
            document.getElementById('textStatusFoto').className = "small fw-bold text-success";
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

function kirimDataTransaksi(e) {
      e.preventDefault();

      Swal.fire({ 
        title: 'Menyimpan Transaksi...', 
        text: 'Mengirim baris log lengkap ke database...', 
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
      });

      // Menyesuaikan struktur payload agar dibaca dengan benar oleh Apps Script
      const payload = {
        petugas: NAMA_PETUGAS_LOGGED_IN,                // Mengirim Nama Petugas asli
        cabang: CABANG_TERVERIFIKASI,                  // Mengirim Nama Cabang (SERPONG / PIK)
        jenisStok: document.getElementById('jenisTransaksi').value, // MASUK atau KELUAR
        barcode: document.getElementById('barcodeBumbu').value,     // Isi teks/link QR Code
        jumlah: parseInt(document.getElementById('jumlahBumbu').value) || 0, // Angka Jumlah Bumbu
        fotoBase64: DATA_BASE64_FOTO,
        koordinat: KOORDINAT_TEREKAM
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        Swal.fire('Berhasil Simpan!', 'Laporan stok telah sukses dicatat di Sheets.', 'success').then(() => {
          document.getElementById('formTransaksi').reset();
          document.getElementById('areaFormTransaksi').classList.add('d-none');
          document.getElementById('textStatusFoto').innerText = "TAP TO CAPTURE PHOTO";
          document.getElementById('textStatusFoto').className = "small fw-bold text-uppercase text-danger";
          DATA_BASE64_FOTO = "";
        });
      })
      .catch((error) => {
        console.error("Gagal Transaksi POST:", error);
        Swal.fire('Gagal Mengirim', 'Terjadi gangguan jaringan: ' + error.toString(), 'error');
      });
    }
      .catch((error) => {
        console.error("Gagal Transaksi POST:", error);
        Swal.fire('Gagal Mengirim', 'Terjadi gangguan jaringan: ' + error.toString(), 'error');
      });
    }
  </script>
</body>
</html>
